<html>
    <head>
        <link rel="stylesheet"  href="../style/form.css"/>
        <link rel="stylesheet"  href="../style/style.css"/>
        <title>Modulo di contatto - Assistenza</title>
    </head>
    <body>
        <form>
            <fieldset>
            <div class="form">
                <legend>Modulo di contatto - Assistenza</legend>
                    <p>Compila il modulo sottostante per inviare una richiesta di assistenza o suggerimenti. Ti risponderemo al più presto.</p>
                    <table class="mail">
                        <tr>
                            <td>Nome:</td>
                            <td><input type="text" name="nome" required/></td>
                        </tr>
                        <tr>
                            <td>Cognome:</td>
                            <td><input type="text" name="cognome" required/></td>
                        </tr>
                        <tr>
                            <td>Email:</td>
                            <td><input type="email" name="email" required/></td>
                        </tr>
                        <tr>
                            <td>Oggetto:</td>
                            <td><input type="text" name="oggetto" required/></td>
                        </tr>
                        <tr>
                            <td>Messaggio:</td>
                            <td><textarea name="messaggio" rows="5" cols="30" required></textarea></td>
                        </tr>
                        <tr>
                            <td colspan="2" style="text-align: center;">
                                <input type="submit" value="Invia"/>
                            </td>
                        </tr>
                    </table>
                </div>
            </fieldset>
        </form> 
    </body>


</html>
